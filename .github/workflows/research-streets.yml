name: "Research: renamed streets (OpenStreetMap)"

# Manual only: downloads South African streets that OpenStreetMap records
# with a previous name, for research into the street names add-on. It makes
# one query to the public Overpass API, so please don't put it on a schedule.
# The results are saved to the separate "research-streets" branch (never to
# main, so nothing is published).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query OpenStreetMap
        run: python tools/streets/fetch_osm_renamed_streets.py
      - name: Save results to the research-streets branch
        run: |
          mkdir -p /tmp/research && cp out/* /tmp/research/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research-streets
          git rm -rq --cached . && git clean -fdq -e out
          mkdir -p research && cp /tmp/research/* research/
          printf 'Research data only (not published). Street data (c) OpenStreetMap contributors, ODbL.\n' > research/README.md
          git add research
          git commit -qm "Renamed streets from OpenStreetMap ($(date -u +%F))"
          git push -f origin research-streets
