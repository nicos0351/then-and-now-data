name: "Research: EV charging stations (OpenStreetMap)"

# Manual only: one OpenStreetMap (Overpass) query for every electric
# vehicle charging station in South Africa, with counts by network,
# province, plug type and power. The results are saved to the separate
# "research-charging" branch (never to main, so nothing is published).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query OpenStreetMap
        run: python tools/charging/fetch_charging.py
      - name: Save results to the research-charging branch
        if: always()
        run: |
          mkdir -p /tmp/research && cp out/* /tmp/research/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research-charging
          git rm -rq --cached . && git clean -fdq -e out
          mkdir -p research && cp /tmp/research/* research/ || true
          printf 'Research data only (not published). Data: OpenStreetMap (ODbL).\n' > research/README.md
          git add research
          git commit -qm "EV charging stations ($(date -u +%F))"
          git push -f origin research-charging
