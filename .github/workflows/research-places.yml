name: "Research: airports, dams and passes (OpenStreetMap)"

# Manual only: downloads South Africa's airports, dams and mountain passes
# from OpenStreetMap, so they can be added to the town data. It makes three
# queries to the public Overpass API, so please don't put it on a schedule.
# The results are saved to the separate "research-places" branch (never to
# main, so nothing is published).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query OpenStreetMap
        run: python tools/places/fetch_osm_places.py
      - name: Save results to the research-places branch
        run: |
          mkdir -p /tmp/research && cp out/* /tmp/research/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research-places
          git rm -rq --cached . && git clean -fdq -e out
          mkdir -p research && cp /tmp/research/* research/
          printf 'Research data only (not published). Data (c) OpenStreetMap contributors, ODbL.\n' > research/README.md
          git add research
          git commit -qm "Airports, dams and passes from OpenStreetMap ($(date -u +%F))"
          git push -f origin research-places
